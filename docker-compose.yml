# Optional local infrastructure: Postgres + Redis.
# The app runs without these (SQLite + local-memory cache).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
      POSTGRES_DB: learningtool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
